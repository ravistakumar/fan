version: 2
project_name: fan
before:
  hooks:
    - go mod tidy
builds:
  - main: ./cmd/fan
    binary: fan
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w -X github.com/ravistakumar/fan/internal/cli.version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
homebrew_casks:
  - name: fan
    repository:
      owner: ravistakumar
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/ravistakumar/fan"
    description: "Agent-agnostic parallel coding-agent orchestrator"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/fan"]
          end
