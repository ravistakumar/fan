<!doctype html>
<!-- Source for the GitHub social-preview image. Render with docs/demo/render-social.sh -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap");
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 640px; }
      body {
        font-family: "JetBrains Mono", monospace;
        background: radial-gradient(1200px 700px at 18% -10%, #20303a 0%, #1e1e2e 55%, #181825 100%);
        color: #cdd6f4;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 80px 90px;
        position: relative;
        overflow: hidden;
      }
      .glow {
        position: absolute; right: -160px; top: -160px;
        width: 520px; height: 520px; border-radius: 50%;
        background: radial-gradient(circle, rgba(166,227,161,0.18) 0%, rgba(166,227,161,0) 70%);
      }
      .wordmark { font-size: 150px; font-weight: 800; letter-spacing: -4px; line-height: 1; color: #a6e3a1; }
      .wordmark .cursor { color: #89b4fa; }
      .subtitle { font-size: 28px; font-weight: 700; margin-top: 8px; color: #a6e3a1; opacity: 0.85; letter-spacing: 2px; text-transform: uppercase; }
      .tagline { font-size: 38px; font-weight: 700; margin-top: 22px; color: #f5f5f7; max-width: 1040px; line-height: 1.25; }
      .flow { font-size: 23px; margin-top: 28px; color: #9399b2; }
      .flow b { color: #89b4fa; font-weight: 700; }
      .flow .ok { color: #a6e3a1; font-weight: 700; }
      .footer {
        position: absolute; left: 90px; bottom: 60px;
        font-size: 22px; color: #7f849c; display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
      }
      .pill { border: 1.5px solid #45475a; border-radius: 999px; padding: 7px 18px; color: #bac2de; font-weight: 700; }
      .gh { position: absolute; right: 90px; bottom: 60px; font-size: 22px; color: #7f849c; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="wordmark">fan<span class="cursor">▌</span></div>
    <div class="subtitle">Fan&nbsp;&middot;&nbsp;Isolate&nbsp;&middot;&nbsp;Gate&nbsp;&middot;&nbsp;Merge</div>
    <div class="tagline">Run many coding agents in parallel — and only merge the ones that pass.</div>
    <div class="flow">task list &nbsp;→&nbsp; <b>parallel agents</b> &nbsp;→&nbsp; <b>isolated worktrees</b> &nbsp;→&nbsp; <span class="ok">auto-merge</span></div>
    <div class="footer">
      <span class="pill">Claude&nbsp;Code</span>
      <span class="pill">Codex</span>
      <span class="pill">OpenCode</span>
      <span class="pill">Aider</span>
      <span class="pill">Grok</span>
    </div>
    <div class="gh">github.com/ravistakumar/fan</div>
  </body>
</html>
